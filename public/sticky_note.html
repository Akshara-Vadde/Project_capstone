<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Notes</title>

    <script>
        const token = localStorage.getItem("token");

        if (!token) {
            alert("Please login first!");
            window.location.href = "sign_up_form.html";
        }

    </script>

    <link rel="stylesheet" href="./css/sticky.css">
</head>

<body>

    <h1 class="main-title">Sticky Notes</h1>
    <input type="text" id="search" placeholder="Search notes...">

    <button id="toggle-dark"></button>

    <button id="add-note">➕ Add Note</button>
    <button id="lgoutbtn" onclick="logout()">Logout</button>

    <div id="notes-container"></div>

    <script>

        const uid = localStorage.getItem("myUserId");

        const addBtn = document.getElementById("add-note");
        const container = document.getElementById("notes-container");
        const searchInput = document.getElementById("search");
        const darkBtn = document.getElementById("toggle-dark");
        darkBtn.innerText = "🌙 Night";

        let notes = [];

        //////////////////searching in multiple notes//////////////
        searchInput.addEventListener("input", () => {

            const value = searchInput.value.toLowerCase().trim();

            document.querySelectorAll(".note").forEach(note => {

                const title =
                    note.querySelector(".note-title").value.toLowerCase();

                const content =
                    note.querySelector("textarea").value.toLowerCase();

                if (
                    title.includes(value) ||
                    content.includes(value)
                ) {
                    note.style.display = "block";
                }
                else {
                    note.style.display = "none";
                }

            });

        });



        async function updateNoteInDB(id, title, content, x, y, datetime) {

            if (id.length < 20) {
                console.log("Waiting for real MongoDB ID...");
                return;
            }

            try {

                await fetch('/updatenote', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id,
                        title,
                        description: content,
                        x,
                        y,
                        datetime
                    })
                });

            }
            catch (err) {
                console.error("Sync failed:", err);
            }
        }

        function createNote({
            id,
            title,
            content,
            x = 100,
            y = 100,
            dateTime = new Date().toLocaleString()
        }) {

            const noteEl = document.createElement("div");

            noteEl.className = "note";
            noteEl.style.left = `${x}px`;
            noteEl.style.top = `${y}px`;

            noteEl.dataset.id = id;

            const titleInput = document.createElement("input");

            titleInput.className = "note-title";
            titleInput.value = title || "";
            titleInput.placeholder = "Title...";

            const textarea = document.createElement("textarea");

            textarea.value = content || "";
            textarea.placeholder = "Notes...";

            ////////////////////////////
            function autoResize() {

                textarea.style.height = "auto";
                textarea.style.height = textarea.scrollHeight + "px";

                noteEl.style.height = "auto";
            }

            autoResize();



            const deleteBtn = document.createElement("button");

            deleteBtn.className = "delete";
            deleteBtn.innerText = "×";

            const moveIcon = document.createElement("div");

            moveIcon.className = "move-icon";
            moveIcon.innerText = "☰";


            //////////////////////

            const infoRow = document.createElement("div");

            infoRow.className = "info-row";



            const dateEl = document.createElement("p");

            dateEl.className = "dateTime";
            dateEl.innerText = new Date(dateTime).toLocaleString() !== "Invalid Date"
                ? new Date(dateTime).toLocaleString()
                : dateTime;


            //////////////////////count of sticky notes///////////////////


            const counter = document.createElement("p");

            counter.className = "counter";
            counter.innerText = `${textarea.value.length}/250`;

            textarea.maxLength = 250;

            infoRow.appendChild(dateEl);
            infoRow.appendChild(counter);

            ////////////////copying the data in notes //////////////////

            const copyBtn = document.createElement("button");

            copyBtn.className = "copy-btn";
            copyBtn.innerText = "📋 Copy";

            copyBtn.addEventListener("click", async () => {

                try {

                    await navigator.clipboard.writeText(textarea.value);

                    copyBtn.innerText = "✅ Copied";

                    setTimeout(() => {
                        copyBtn.innerText = "📋 Copy";
                    }, 1500);

                }
                catch (err) {
                    alert("Copy failed");
                }

            });





            noteEl.appendChild(titleInput);
            noteEl.appendChild(textarea);
            noteEl.appendChild(deleteBtn);
            noteEl.appendChild(moveIcon);

            noteEl.appendChild(infoRow);
            noteEl.appendChild(copyBtn);

            container.appendChild(noteEl);

            titleInput.addEventListener("input", () => {

                const currentId = noteEl.dataset.id;

                const idx = notes.findIndex((n) => n.id === currentId);

                if (idx !== -1) {

                    notes[idx].title = titleInput.value;

                    updateNoteInDB(
                        currentId,
                        titleInput.value,
                        textarea.value,
                        notes[idx].x,
                        notes[idx].y,
                        notes[idx].dateTime
                    );
                }

            });

            textarea.addEventListener("input", () => {

                autoResize();

                const currentId = noteEl.dataset.id;

                const idx = notes.findIndex((n) => n.id === currentId);

                if (idx !== -1) {

                    notes[idx].content = textarea.value;

                    // update counter
                    counter.innerText = `${textarea.value.length}/250`;

                    updateNoteInDB(
                        currentId,
                        titleInput.value,
                        textarea.value,
                        notes[idx].x,
                        notes[idx].y,
                        notes[idx].dateTime
                    );
                }

            });

            let offsetX, offsetY;

            noteEl.addEventListener("mousedown", (e) => {

                if (
                    e.target.tagName === "TEXTAREA" ||
                    e.target.tagName === "INPUT" ||
                    e.target.className === "delete" ||/////////
                    e.target.className === "copy-btn" ||
                    e.target.className === "color-btn"
                ) return;

                offsetX = e.offsetX;
                offsetY = e.offsetY;

                function onMouseMove(ev) {

                    noteEl.style.left = `${ev.pageX - offsetX}px`;
                    noteEl.style.top = `${ev.pageY - offsetY}px`;

                }

                function onMouseUp() {

                    const currentId = noteEl.dataset.id;

                    const newX = parseInt(noteEl.style.left);
                    const newY = parseInt(noteEl.style.top);

                    const idx = notes.findIndex((n) => n.id === currentId);

                    if (idx !== -1) {

                        notes[idx].x = newX;
                        notes[idx].y = newY;

                        updateNoteInDB(
                            currentId,
                            titleInput.value,
                            textarea.value,
                            notes[idx].x,
                            notes[idx].y,
                            notes[idx].dateTime
                        );
                    }

                    document.removeEventListener("mousemove", onMouseMove);
                    document.removeEventListener("mouseup", onMouseUp);

                }

                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", onMouseUp);

            });

            deleteBtn.addEventListener("click", async () => {

                const currentId = noteEl.dataset.id;

                noteEl.remove();

                notes = notes.filter((n) => n.id !== currentId);

                if (currentId.length === 24) {

                    try {

                        const response = await fetch(`/deletenote/${currentId}`, {
                            method: 'DELETE'
                        });

                        const result = await response.json();

                        if (result.success) {
                            console.log("Note permanently deleted from DB");
                        }

                    }
                    catch (err) {
                        console.error("Failed to delete note from server:", err);
                    }

                }
                else {
                    console.log("Temporary note removed");
                }

            });

        }

        addBtn.addEventListener("click", async () => {

            const tempId = Date.now().toString();

            const currentDateTime = new Date();

            const noteForUI = {
                id: tempId,
                title: "",
                content: "",
                x: 100,
                y: 100,
                dateTime: currentDateTime
            };

            notes.push(noteForUI);

            createNote(noteForUI);

            try {

                const response = await fetch('/addnote', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: "",
                        description: "",
                        userId: uid,
                        x: 100,
                        y: 100,
                        dateTime: currentDateTime
                    })
                });

                const result = await response.json();

                if (result.success) {

                    const noteIndex = notes.findIndex(n => n.id === tempId);

                    if (noteIndex !== -1) {
                        notes[noteIndex].id = result.note._id;
                    }

                    const element = document.querySelector(`[data-id="${tempId}"]`);

                    if (element) {
                        element.dataset.id = result.note._id;
                    }

                }

            }
            catch (err) {
                console.error("Add note failed:", err);
            }

        });

        async function fetchNotes() {

            try {

                const response = await fetch(`/getnotes/${uid}`);

                const data = await response.json();

                if (Array.isArray(data)) {

                    notes = data.map(n => ({
                        id: n._id,
                        title: n.title,
                        content: n.description,
                        x: n.x !== undefined ? n.x : 100,
                        y: n.y !== undefined ? n.y : 100,
                        dateTime: n.dateTime
                    }));

                    container.innerHTML = "";

                    notes.forEach(note => createNote(note));

                }

            }
            catch (err) {
                console.error("Failed to load notes:", err);
            }

        }

        function logout() {

            localStorage.removeItem("token");
            localStorage.removeItem("uid");

            window.location.href = "sign_up_form.html";

        }

        //////////////////////dark-mode///////////////////////////
        darkBtn.addEventListener("click", () => {

            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {
                darkBtn.innerText = "☀️ Light";
            }
            else {
                darkBtn.innerText = "🌙 Night";
            }

        });


        fetchNotes();

    </script>

</body>

</html>
